name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install build dependencies
        run: uv pip install pyinstaller pystray pillow

      - name: Run tests
        run: uv run pytest

      - name: Build
        run: uv run pyinstaller mtgcompare.spec --clean --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist\mtgcompare -DestinationPath dist\mtgcompare-windows.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/mtgcompare-windows.zip
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install build dependencies
        run: uv pip install pyinstaller pystray pillow pyobjc-framework-Cocoa

      - name: Run tests
        run: uv run pytest

      - name: Build
        # MTGCOMPARE_VERSION drives the .app bundle's CFBundleShortVersionString
        # via mtgcompare.spec. ${{ github.ref_name }} is e.g. "v1.6.9"; strip
        # the leading "v" for Apple plist convention.
        run: |
          export MTGCOMPARE_VERSION="${GITHUB_REF_NAME#v}"
          uv run pyinstaller mtgcompare.spec --clean --noconfirm

      - name: Zip
        run: cd dist && zip -r mtgcompare-macos.zip "MTG Compare.app"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/mtgcompare-macos.zip
          generate_release_notes: false

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # The image is the only thing nothing else CVE-scans: the GHCR package
      # is private, so server_admin's weekly image-scan and the pentest run
      # can't pull it (they report "scan unavailable"), and pip-audit in CI
      # only sees the Python deps, not the Debian base. Scan it here, before
      # it is pushed: a fixable CRITICAL fails the release (bump the base
      # digest in the Dockerfile and re-tag); HIGHs are reported only.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: mtgcompare:scan

      - name: Install trivy
        # Installer and binary pinned to one release (same as server_admin's
        # image-scan workflow); install.sh verifies the release checksum.
        env:
          TRIVY_VERSION: v0.74.0
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: Scan image
        run: |
          trivy image --quiet --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format table mtgcompare:scan \
            | tee trivy.txt
          { echo '### Image CVE scan (fixable HIGH/CRITICAL)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --scanners vuln --ignore-unfixed \
            --severity CRITICAL --exit-code 1 mtgcompare:scan > /dev/null

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
