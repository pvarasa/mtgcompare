name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install build dependencies
        run: uv pip install pyinstaller pystray pillow

      - name: Run tests
        run: uv run pytest

      - name: Build
        run: uv run pyinstaller mtgcompare.spec --clean --noconfirm

      - name: Zip
        run: Compress-Archive -Path dist\mtgcompare -DestinationPath dist\mtgcompare-windows.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/mtgcompare-windows.zip
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install build dependencies
        run: uv pip install pyinstaller pystray pillow pyobjc-framework-Cocoa

      - name: Run tests
        run: uv run pytest

      - name: Build
        # MTGCOMPARE_VERSION drives the .app bundle's CFBundleShortVersionString
        # via mtgcompare.spec. ${{ github.ref_name }} is e.g. "v1.6.9"; strip
        # the leading "v" for Apple plist convention.
        run: |
          export MTGCOMPARE_VERSION="${GITHUB_REF_NAME#v}"
          uv run pyinstaller mtgcompare.spec --clean --noconfirm

      - name: Zip
        run: cd dist && zip -r mtgcompare-macos.zip "MTG Compare.app"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/mtgcompare-macos.zip
          generate_release_notes: false

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
